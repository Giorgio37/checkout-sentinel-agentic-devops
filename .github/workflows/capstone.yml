name: capstone-pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . pytest
      - run: pytest
      - run: checkout-sentinel prepare
      - uses: actions/upload-artifact@v4
        with:
          name: capstone-evidence
          path: artifacts/
          if-no-files-found: error

